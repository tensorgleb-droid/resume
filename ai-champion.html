<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: DocuSketch-style one-pager — warm paper ground with a lemon glow at the top, mono display title, white cards; swimlane process left, Slack setup right, pilot strip at the foot */
:root{
  --bg:#F4F3EA; --surface:#FFFFFF; --ink:#000000; --ink-2:#1A1905; --muted:#6B6852;
  --line:#E2E0D3; --line-2:#C0BC90; --accent:#E5DF00; --on-accent:#1A1905; --lane:#FAF9F3; --glow:#EFEA7A;
  --good:#3F7D3A; --warn:#9A6B00; --park:#7B7862;
  --f-display:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12120C; --surface:#1C1C15; --ink:#F4F3EA; --ink-2:#F4F3EA; --muted:#A9A68E;
  --line:#2E2D22; --line-2:#5A5740; --lane:#17170F; --glow:#3A3810; --good:#7CC474; --warn:#E3B53B; --park:#A3A08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12120C; --surface:#1C1C15; --ink:#F4F3EA; --ink-2:#F4F3EA; --muted:#A9A68E;
  --line:#2E2D22; --line-2:#5A5740; --lane:#17170F; --glow:#3A3810; --good:#7CC474; --warn:#E3B53B; --park:#A3A08A; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--glow) 0,var(--bg) 260px) no-repeat;color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:20px;padding-block:16px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:14px;position:relative}
.cross{position:absolute;width:13px;height:13px;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--ink-2);opacity:.55}
.cross::before{left:6px;top:0;width:1px;height:13px}
.cross::after{top:6px;left:0;height:1px;width:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:8px 10px 8px 16px;border:1px solid var(--line)}
.brand{font:600 14px var(--f-body);letter-spacing:-.3px}
.brand sup{font-size:9px}
.lang{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.lang button{border:0;background:transparent;color:var(--ink-2);font:600 12px var(--f-label);letter-spacing:.06em;padding:5px 12px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:8px 2px 2px}
.eyebrow{font:500 11.5px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:500 clamp(22px,3.4vw,38px)/1.08 var(--f-display);letter-spacing:-1px;text-transform:uppercase;margin:6px 0 8px;text-wrap:balance}
h1 .hl{background:var(--accent);color:var(--on-accent);padding:0 .18em;border-radius:6px;white-space:nowrap}
.lead{margin:0;color:var(--ink-2);max-width:66ch;font-size:15px}
.load{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.load b{font:600 24px var(--f-display);letter-spacing:-1px}
.load small{color:var(--muted);line-height:1.3;font-size:12.5px}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font:600 12.5px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
button{font:inherit}
.play{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:7px 14px;font:500 13px var(--f-body);cursor:pointer}
.play:hover{filter:brightness(.96)}
.play:focus-visible,.node:focus-visible,.react:focus-visible,.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scroller{overflow-x:auto}
.bpmn{position:relative;display:grid;grid-template-columns:124px repeat(5,minmax(104px,1fr));min-width:700px}
.colh{font:500 11.5px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 4px 6px}
.lanel{display:flex;flex-direction:column;justify-content:center;padding:8px 10px;background:var(--lane);border-top:1px solid var(--line);font:600 12.5px/1.25 var(--f-label)}
.lanel small{font:400 11.5px/1.3 var(--f-body);color:var(--muted)}
.cell{border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 8px;min-height:76px}
.cell.alt{background:var(--lane)}
.node{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:12.5px;line-height:1.3;text-align:left;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.node:hover{border-color:var(--ink-2)}
.node.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:translateY(-1px)}
.node .k{display:block;font:500 10.5px var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.node.on .k{color:var(--on-accent);opacity:.7}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.wires .w{fill:none;stroke:var(--line-2);stroke-width:1.5;transition:stroke .2s}
.wires .w.on{stroke:var(--ink);stroke-width:2}
.wires .mk{fill:var(--line-2)}
.wires .mk.on{fill:var(--ink)}
.wires text{font:500 10.5px var(--f-label);letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.detail{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;min-height:72px}
.detail .step{font:600 28px var(--f-display);grid-row:span 2;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 10px;line-height:1.3}
.detail h3{margin:0;font:600 15px var(--f-body);letter-spacing:-.2px}
.detail p{margin:0;color:var(--muted);max-width:78ch}
.side{display:grid;gap:14px;align-content:start}
.ch{display:grid;gap:10px}
.chan{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.chan code,.note code{font:600 13.5px var(--f-display);color:var(--ink);background:var(--bg);border-radius:6px;padding:1px 6px}
.chan em{font:500 11px var(--f-label);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chan span{flex-basis:100%;color:var(--muted);font-size:12.5px}
.rules{margin:4px 0 0;padding-left:20px;display:grid;gap:2px;font-size:12.5px}
.rules li::marker{font:600 12px var(--f-display);color:var(--ink-2)}
.note{margin:0;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line-2);padding-top:8px}
.note code{font-size:12.5px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;background:var(--lane)}
.card .who{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.av{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 10.5px var(--f-display)}
.tag{font:500 10.5px var(--f-label);letter-spacing:.06em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.card dt{color:var(--muted);font:500 11px var(--f-label);letter-spacing:.05em;text-transform:uppercase;padding-top:1px}
.card dd{margin:0}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.react{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.react[aria-pressed="true"]{border-color:currentColor;font-weight:600}
.react.r1[aria-pressed="true"]{color:var(--warn)}
.react.r2[aria-pressed="true"]{color:var(--good)}
.react.r3[aria-pressed="true"]{color:var(--park)}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.pilot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.pilot strong{font:500 15px var(--f-display);text-transform:uppercase;letter-spacing:-.3px}
.metric{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.metric i{font:600 11px var(--f-display);font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:1px 6px}
.metric.last{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <span class="cross" style="left:-7px;top:62px" aria-hidden="true"></span>
  <span class="cross" style="right:-7px;top:62px" aria-hidden="true"></span>

  <div class="topbar">
    <span class="brand">AI Manager<sup>°</sup></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="l-ru" data-l="ru" aria-pressed="true">RU</button>
      <button type="button" id="l-en" data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <header>
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1><span data-i="name"></span> — <span class="hl">AI&nbsp;Manager</span></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <div class="load"><b>10–20%</b><small data-i="load"></small></div>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="proc-h">
      <div class="ph">
        <h2 id="proc-h" data-i="proc"></h2>
        <button class="play" id="play" type="button"></button>
      </div>
      <div class="scroller">
        <div class="bpmn" id="bpmn">
          <div></div>
          <div class="colh" data-i="c1"></div><div class="colh" data-i="c2"></div><div class="colh" data-i="c3"></div><div class="colh" data-i="c4"></div><div class="colh" data-i="c5"></div>

          <div class="lanel"><span data-i="lane1"></span><small data-i="lane1s"></small></div>
          <div class="cell"><button class="node" data-n="0" type="button"><span class="k" data-i="k0"></span><span data-i="n0"></span></button></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

          <div class="lanel">AI Manager<small data-i="lane2s"></small></div>
          <div class="cell alt"></div>
          <div class="cell alt"><button class="node" data-n="1" type="button"><span class="k" data-i="k1"></span><span data-i="n1"></span></button></div>
          <div class="cell alt"></div>
          <div class="cell alt"><button class="node" data-n="3" type="button"><span class="k">👀 ✅ 🅿️</span><span data-i="n3"></span></button></div>
          <div class="cell alt"></div>

          <div class="lanel"><span data-i="lane3"></span><small data-i="lane3s"></small></div>
          <div class="cell"></div><div class="cell"></div>
          <div class="cell"><button class="node" data-n="2" type="button"><span class="k" data-i="k2"></span><span data-i="n2"></span></button></div>
          <div class="cell"></div><div class="cell"></div>

          <div class="lanel"><span data-i="lane4"></span></div>
          <div class="cell alt"></div><div class="cell alt"></div><div class="cell alt"></div><div class="cell alt"></div>
          <div class="cell alt">
            <button class="node" data-n="4" type="button"><span class="k" data-i="k4"></span><span data-i="n4"></span></button>
            <button class="node" data-n="5" type="button"><span class="k" data-i="k5"></span><span data-i="n5"></span></button>
          </div>
          <svg class="wires" id="wires" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="detail" aria-live="polite">
        <div class="step" id="d-n">1</div>
        <h3 id="d-t"></h3>
        <p id="d-p"></p>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="ph"><h2 data-i="chH"></h2></div>
        <div class="ch">
          <div class="chan"><code>#ai-requests</code><em data-i="chWho"></em><span data-i="chWhat"></span></div>
          <div>
            <div class="eyebrow" data-i="rulesH"></div>
            <ol class="rules">
              <li data-i="r1"></li><li data-i="r2"></li><li data-i="r3"></li><li data-i="r4"></li><li data-i="r5"></li>
            </ol>
          </div>
          <p class="note"><span data-i="noteA"></span> <code>#general</code>.</p>
        </div>
      </section>
      <section class="panel">
        <div class="ph"><h2><span data-i="cardH"></span> #ai-requests</h2></div>
        <div class="card">
          <div class="who"><div class="av">AI</div><b data-i="newReq"></b><span class="tag" data-i="example"></span></div>
          <dl>
            <dt data-i="dWho"></dt><dd data-i="vWho"></dd>
            <dt data-i="dTask"></dt><dd data-i="vTask"></dd>
            <dt data-i="dTime"></dt><dd data-i="vTime"></dd>
            <dt data-i="dData"></dt><dd data-i="vData"></dd>
            <dt data-i="dUrg"></dt><dd data-i="vUrg"></dd>
          </dl>
          <div class="reacts" role="group" aria-label="Status">
            <button class="react r1" type="button" aria-pressed="true">👀 <span data-i="s1"></span></button>
            <button class="react r2" type="button" aria-pressed="false">✅ <span data-i="s2"></span></button>
            <button class="react r3" type="button" aria-pressed="false">🅿️ <span data-i="s3"></span></button>
          </div>
        </div>
        <p class="hint" data-i="hint"></p>
      </section>
    </aside>
  </div>

  <section class="panel pilot">
    <strong data-i="pilot"></strong>
    <span class="metric"><i>01</i><span data-i="m1"></span></span>
    <span class="metric"><i>02</i><span data-i="m2"></span></span>
    <span class="metric"><i>03</i><span data-i="m3"></span></span>
    <span class="metric last" data-i="m4"></span>
  </section>
</div>

   ['4','The idea gets a status','After the sync Ksenia marks the card: 👀 in review, ✅ taken or 🅿️ parked. The author always sees where their idea stands.'],
   ['5','Needs development — to the developers','If the idea needs development or integration, it goes to the developers for approval together with the impact estimate.'],
   ['5','Existing tools are enough — we build it','If available AI tools can solve the task, AI enthusiasts build it themselves and post the result in #general.']
  ]}
};
let lang='ru';
try{const s=localStorage.getItem('aim-lang');if(s==='en'||s==='ru')lang=s}catch(e){}
const edges=[[0,1],[1,2],[2,3],[3,4,'e1'],[3,5,'e2']];
const bp=document.getElementById('bpmn'),svg=document.getElementById('wires'),play=document.getElementById('play');
const nodes=[...document.querySelectorAll('.node')].sort((a,b)=>a.dataset.n-b.dataset.n);
let cur=0,timer=null;
function draw(){
  const B=bp.getBoundingClientRect();
  let h='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk on" d="M0 0L10 5L0 10z"/></marker></defs>';
  edges.forEach(([a,b,l])=>{
    const A=nodes[a].getBoundingClientRect(),C=nodes[b].getBoundingClientRect();
    const x1=A.right-B.left,y1=A.top+A.height/2-B.top,x2=C.left-B.left-2,y2=C.top+C.height/2-B.top;
    const mx=Math.round(x1+(x2-x1)/2),lit=b===cur;
    h+=`<path class="w${lit?' on':''}" d="M${x1} ${y1}H${mx}V${y2}H${x2}" marker-end="url(#${lit?'aho':'ah'})"/>`;
    if(l)h+=`<text x="${mx+5}" y="${y2-6}">${T[lang][l]}</text>`;
  });
  svg.innerHTML=h;
}
function select(i){
  cur=i;
  nodes.forEach((n,k)=>n.classList.toggle('on',k===i));
  const s=T[lang].steps[i];
  document.getElementById('d-n').textContent=s[0];
  document.getElementById('d-t').textContent=s[1];
  document.getElementById('d-p').textContent=s[2];
  draw();
}
function stop(){clearInterval(timer);timer=null;play.textContent=T[lang].play}
function setLang(l){
  lang=l;document.documentElement.lang=l;
  try{localStorage.setItem('aim-lang',l)}catch(e){}
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[l][el.dataset.i];if(v!==undefined)el.textContent=v});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false'));
  play.textContent=timer?T[l].stop:T[l].play;
  select(cur);
}
nodes.forEach(n=>n.addEventListener('click',()=>{stop();select(+n.dataset.n)}));
play.addEventListener('click',()=>{
  if(timer){stop();return}
  let i=0;select(0);play.textContent=T[lang].stop;
  timer=setInterval(()=>{i++;if(i>=nodes.length){stop();return}select(i)},2200);
});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
document.querySelectorAll('.react').forEach(r=>r.addEventListener('click',()=>{
  document.querySelectorAll('.react').forEach(x=>x.setAttribute('aria-pressed',x===r?'true':'false'));
}));
addEventListener('resize',draw);
if(document.fonts)document.fonts.ready.then(draw);
setLang(lang);
</script>
</body>
</html>
